<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Innovarch Secure Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 flex items-center justify-center h-screen font-sans">
    <div class="bg-slate-900 p-8 rounded-xl shadow-2xl border border-slate-800 w-full max-w-sm">
        <div class="text-center mb-8">
            <h1 class="text-red-600 font-black text-3xl tracking-tighter">INNO<span class="text-white">VARCH</span></h1>
            <p class="text-slate-500 text-sm tracking-widest uppercase mt-1">Secure Operational Hub</p>
        </div>
        
        <form id="loginForm" class="space-y-5">
            <div>
                <label class="block text-sm font-medium text-slate-400 mb-1">Corporate Email</label>
                <input type="email" id="email" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-3 text-white focus:border-blue-500 focus:outline-none" placeholder="ceo@innovarch.com" required>
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-400 mb-1">Password</label>
                <input type="password" id="password" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-3 text-white focus:border-blue-500 focus:outline-none" placeholder="••••••••" required>
            </div>
            
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg mt-4 transition duration-200">
                Authenticate Securely
            </button>
        </form>
        <div id="errorMsg" class="hidden mt-4 text-red-500 text-center text-sm font-medium">Invalid credentials. Access denied.</div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;

            // THE FAKE "DEMO" AUTHENTICATION
            if(email === 'ceo@innovarch.com' && pass === 'demo2026') {
                // If correct, redirect to the portal
                window.location.href = 'portal.html';
            } else {
                document.getElementById('errorMsg').classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
