<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Innovarch Portal - POC</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-200 h-screen flex items-center justify-center font-sans">

    <div class="bg-slate-800 p-8 rounded-xl shadow-2xl border border-slate-700 w-full max-w-md relative">
        <div class="text-red-500 font-black text-2xl mb-6 tracking-tighter">INNO<span class="text-white">VARCH</span> <span class="text-xs text-slate-400 font-normal tracking-normal uppercase ml-2">Secure Core</span></div>
        
        <h2 class="text-xl font-bold text-white mb-6">New Financial Requisition</h2>
        
        <form id="pocForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-400 mb-1">Staff Name</label>
                <input type="text" id="staffName" class="w-full bg-slate-900 border border-slate-600 rounded-lg p-3 text-white focus:border-blue-500 focus:outline-none" placeholder="e.g. John Doe" required>
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-400 mb-1">Project Code / Name</label>
                <input type="text" id="project" class="w-full bg-slate-900 border border-slate-600 rounded-lg p-3 text-white focus:border-blue-500 focus:outline-none" placeholder="e.g. Abuja Site Prep" required>
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-400 mb-1">Amount (₦)</label>
                <input type="number" id="amount" class="w-full bg-slate-900 border border-slate-600 rounded-lg p-3 text-white focus:border-blue-500 focus:outline-none" placeholder="1500000" required>
            </div>

            <div>
                    <label class="block text-sm font-medium text-slate-400 mb-1">Request Justification / Details</label>
                    <textarea id="details" rows="3" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-3 text-white focus:border-blue-500 focus:outline-none" placeholder="Provide context for this requisition..." required></textarea>
            </div>
            
            <button type="submit" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg mt-4 transition duration-200">
                Route to CEO
            </button>
        </form>

        <div id="successMsg" class="hidden mt-4 p-3 bg-green-900/30 border border-green-500/30 text-green-400 rounded-lg text-center text-sm">
            Request routed successfully. Awaiting executive approval.
        </div>
    </div>

    <script>
        document.getElementById('pocForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.innerText = 'Routing...';
            btn.disabled = true;

           const data = {
                staffName: document.getElementById('staffName').value,
                project: document.getElementById('project').value,
                amount: document.getElementById('amount').value,
                details: document.getElementById('details').value // <-- Add this line
            };

            // PASTE YOUR APP SCRIPT URL HERE
            const scriptURL = 'https://script.google.com/macros/s/AKfycby2efnan1MGBhzTxEhpFbCrkEL-Pg5r_Fl6-y5_esVRIl5nphgVAsQBqxR5L8xyLEa8ig/exec';

            fetch(scriptURL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            }).then(() => {
                btn.style.display = 'none';
                document.getElementById('successMsg').classList.remove('hidden');
                document.getElementById('pocForm').reset();
            }).catch(err => {
                btn.innerText = 'Error';
                btn.classList.add('bg-red-600');
            });
        });
    </script>
</body>
</html>
