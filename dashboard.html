<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Innovarch Executive Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-200 h-screen flex flex-col font-sans">

    <nav class="bg-slate-900 border-b border-slate-800 p-4 flex justify-between items-center">
        <div class="text-red-600 font-black text-xl tracking-tighter">INNO<span class="text-white">VARCH</span> <span class="text-xs text-slate-500 font-normal uppercase ml-2">Tier 1 Core</span></div>
        <div class="flex items-center gap-4">
            <span class="text-sm text-slate-400">Logged in as: <strong class="text-white">CEO (Admin)</strong></span>
            <a href="index.html" class="text-sm text-red-400 hover:text-red-300">Logout</a>
        </div>
    </nav>

    <div class="flex-grow flex items-center justify-center p-6">
        <div class="bg-slate-900 p-8 rounded-xl shadow-2xl border border-slate-800 w-full max-w-lg">
            
            <h2 class="text-2xl font-bold text-white mb-2">Financial Requisition Engine</h2>
            <p class="text-slate-400 text-sm mb-6">Submit a new automated request. This will instantly route to executive email queues.</p>
            
            <form id="pocForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-400 mb-1">Originating Staff Name</label>
                    <input type="text" id="staffName" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-3 text-white focus:border-blue-500 focus:outline-none" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-400 mb-1">Project Code / Name</label>
                    <input type="text" id="project" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-3 text-white focus:border-blue-500 focus:outline-none" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-400 mb-1">Disbursement Amount (₦)</label>
                    <input type="number" id="amount" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-3 text-white focus:border-blue-500 focus:outline-none" required>
                </div>
                
                <button type="submit" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-4 rounded-lg mt-6 transition duration-200 flex justify-center items-center gap-2">
                    <svg style="width:20px; height:20px;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
                    Route to Executive Approval
                </button>
            </form>

            <div id="successMsg" class="hidden mt-6 p-4 bg-green-900/20 border border-green-500/30 text-green-400 rounded-lg text-center text-sm font-medium">
                ✓ Requisition routed successfully. Check your email for the live approval trigger.
            </div>
        </div>
    </div>

    <script>
        document.getElementById('pocForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.innerHTML = 'Encrypting & Routing...';
            btn.disabled = true;

            const data = {
                staffName: document.getElementById('staffName').value,
                project: document.getElementById('project').value,
                amount: document.getElementById('amount').value
            };

            // ⚠️ PASTE YOUR GOOGLE APPS SCRIPT URL HERE
            const scriptURL = 'PASTE_YOUR_WEB_APP_URL_HERE';

            fetch(scriptURL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            }).then(() => {
                btn.style.display = 'none';
                document.getElementById('successMsg').classList.remove('hidden');
                document.getElementById('pocForm').reset();
            }).catch(err => {
                btn.innerText = 'Routing Error';
                btn.classList.add('bg-red-600');
            });
        });
    </script>
</body>
</html>
